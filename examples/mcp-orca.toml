# Example mcp-orca configuration (v1 scaffold)
# See docs/DESIGN.md for the design and integration placeholders.

[server]
transport = "stdio"

[workspace]
root = "~/.local/share/mcp-orca"

[engine]
# Slicing is disabled until an invocation is configured:
# - preset = "orca" uses the built-in OrcaSlicer headless CLI contract, OR
# - provide slice_command for a custom argv template (overrides preset).
runner = "binary"
preset = "orca"
binary = "orca-slicer"
# Binary detection mode: "manual" (use only configured binary) or "auto" (try multiple common OrcaSlicer names)
# binary_detection = "auto"
# docker_image = "your-orcaslicer-image:tag"
timeout_secs = 900
max_concurrent_jobs = 2

# Built-in preset (orca): stages model(s) + native printer/filament/process .json
# presets, passes --load-settings "process.json;printer.json",
# --load-filaments, merged --key=value overrides (underscore->hyphen), --arrange 1,
# --slice 0, --outputdir {jobdir}. Orca writes plate_N.gcode; single-plate output
# is collected into output.gcode. Preset selections must resolve to native preset
# files (path/indexed/base_profile).

# Custom argv template (overrides preset). Placeholders:
#   {binary} {image} {jobdir} {gcode} {models} {model}
#   {printer} {filament} {process} {project} {overrides} {settings} {plan_json}
# `{models}` expands to one argument per staged model; `{model}` is the first.
# slice_command = [
#   "{binary}", "{models}",
#   "--load-settings", "{process};{printer}",
#   "--load-filaments", "{filament}",
#   "--arrange", "1", "--slice", "0",
#   "--outputdir", "{jobdir}",
# ]
# docker_command = ["docker", "run", "--rm", "-v", "{jobdir}:{jobdir}", "-w", "{jobdir}"]
# Extra environment variables for the slicer process (placeholder-expanded).
# env = { ORCA_PROFILE_DIR = "{jobdir}/profiles" }

[profiles]
# Bounded discovery: explicit paths + OS-detected common defaults.
# search_paths = ["/path/to/profiles"]
use_os_defaults = true

[approval]
# in_band (default) / out_of_band / both. out_of_band disables MCP-side
# decisions; use `mcp-orca approvals approve|deny <id>` instead.
mode = "in_band"
ttl_secs = 120

[policy]
allow_workspace_writes = true
allow_slicing = true
allow_export = true
allow_delete = true
